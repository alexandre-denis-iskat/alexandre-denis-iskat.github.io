<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexandre Denis · Portfolio</title>
<meta name="description" content="Portfolio d'Alexandre Denis, administrateur d'infrastructures sécurisées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : page unique à sections ancrées ; chaque section s'ouvre sur une ligne de commande animée ; le héros est une fenêtre de terminal interactive ; FR/EN */
:root{
  --bg:#030504; --win:#080b0a; --bar:#0d1210; --line:#1b2520;
  --fg:#e3ebe6; --soft:#b9c6be; --dim:#7d8f84; --green:#6fd08c; --cyan:#6fd3e8; --amber:#f2c46b; --red:#ff5f5f;
  --violet:#b99cff; --blue:#7aa8ff; --pink:#ff8cc6; --orange:#ff9f6b; --yellow:#f6de78; --teal:#5ee0c0;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --green-base:#6fd08c;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:16px;line-height:1.7;}
html{overflow-x:clip}
section.s.wrap{padding-block:26px!important}
section.s::before{display:none!important}
#sections{padding-bottom:40px}
.swin,.cwin{background:var(--band);border:1px solid color-mix(in srgb,var(--green) 32%,#1b2520);border-radius:12px;overflow:hidden;
  box-shadow:0 0 46px -20px color-mix(in srgb,var(--green) 55%,transparent);transition:box-shadow .4s}
.swin:hover{box-shadow:0 0 56px -18px color-mix(in srgb,var(--green) 70%,transparent)}
.swin>.titlebar,.cwin>.titlebar{background:color-mix(in srgb,var(--green) 9%,#090c0b);border-bottom:1px solid color-mix(in srgb,var(--green) 22%,#141c18)}
.swin>.titlebar .t,.cwin>.titlebar .t{color:color-mix(in srgb,var(--green) 55%,#7d8f84)}
.swin>.titlebar .clk,.cwin>.titlebar .clk{color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.sbody{padding:30px 36px 36px}
.cwin{margin:12px 0 0;box-shadow:0 0 30px -18px color-mix(in srgb,var(--green) 50%,transparent)}
.cwin>.titlebar{padding:7px 14px}.cwin .dots i{width:9px;height:9px}
.cwin .clog{padding:10px 18px 0;max-height:170px;overflow-y:auto;font-family:var(--mono);font-size:13px}
.cwin .clog:empty{display:none}
.cwin .clog div{padding:1px 0;white-space:pre-wrap;word-break:break-word;color:var(--soft);animation:lineIn .25s ease-out both}
.cwin .clog .g{color:var(--green)}.cwin .clog .a{color:color-mix(in srgb,var(--green) 70%,#fff)}.cwin .clog .r{color:var(--red)}.cwin .clog .d{color:var(--dim)}
.cwin form{display:flex;align-items:center;gap:10px;padding:10px 18px;font-family:var(--mono);font-size:13.5px}
.cwin .clog:not(:empty)+form{border-top:1px solid color-mix(in srgb,var(--green) 18%,#141c18);margin-top:8px}
.cwin label{white-space:nowrap;color:var(--green)}
.cwin input{flex:1;min-width:0;background:transparent;border:none;color:var(--fg);font:inherit;padding:3px 0;caret-color:var(--green)}
.cwin input:focus{outline:none}.cwin input::placeholder{color:var(--dim)}
.flashel{animation:flashEl 1.4s ease-out}
@keyframes flashEl{0%{box-shadow:0 0 0 2px var(--green);background-color:color-mix(in srgb,var(--green) 14%,var(--win))}100%{box-shadow:0 0 0 0 transparent}}
section.s.reveal{animation:none}
section.s.reveal .swin,section.s.reveal .cwin{animation:winUp .6s cubic-bezier(.2,.7,.2,1) both;animation-play-state:paused}
section.s.reveal .cwin{animation-delay:.15s}
section.s.reveal.in .swin,section.s.reveal.in .cwin{animation-play-state:running}
@keyframes winUp{from{transform:translateY(18px) scale(.985)}to{transform:none}}
@media (max-width:620px){.sbody{padding:22px 18px 26px}.cwin .clog,.cwin form{padding-left:12px;padding-right:12px}}
section.s{position:relative;isolation:isolate;padding-block:72px 72px!important;--band:color-mix(in srgb,var(--green) 3%,#020303);--win:color-mix(in srgb,var(--green) 4%,#050706);--bar:color-mix(in srgb,var(--green) 6%,#080b0a);--line:color-mix(in srgb,var(--green) 22%,#141c18);--soft:color-mix(in srgb,var(--green) 12%,#b9c6be);--dim:color-mix(in srgb,var(--green) 18%,#7d8f84)}
section.s::before{content:"";position:absolute;inset:-64px calc(50% - 50vw);z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent 0,var(--band) 64px,var(--band) calc(100% - 64px),transparent 100%)}
section.s .yr{color:var(--green)}
#a-propos{--green:var(--cyan)} #competences{--green:var(--violet)} #stack{--green:var(--teal)} #diplomes{--green:var(--amber)} #portfolio{--green:var(--blue)} #contact{--green:var(--red)}
nav.menu a[data-sec="a-propos"]{--c:var(--cyan)} nav.menu a[data-sec="competences"]{--c:var(--violet)} nav.menu a[data-sec="stack"]{--c:var(--teal)}
nav.menu a[data-sec="diplomes"]{--c:var(--amber)} nav.menu a[data-sec="portfolio"]{--c:var(--blue)} nav.menu a[data-sec="contact"]{--c:var(--red)}
nav.menu a[data-sec]:hover{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
nav.menu a[data-sec="a-propos"].on{color:var(--cyan)} nav.menu a[data-sec="competences"].on{color:var(--violet)} nav.menu a[data-sec="stack"].on{color:var(--teal)}
nav.menu a[data-sec="diplomes"].on{color:var(--amber)} nav.menu a[data-sec="portfolio"].on{color:var(--blue)} nav.menu a[data-sec="contact"].on{color:var(--red)}
.pc .kind::before,.st .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--green);margin-right:7px;vertical-align:1px}
.pc{border-top:2px solid color-mix(in srgb,var(--green) 55%,transparent)}
.st{border-top:2px solid color-mix(in srgb,var(--green) 55%,transparent)}
.timeline article{position:relative}
.skcat{border-top:2px solid color-mix(in srgb,var(--green) 55%,transparent)}
.hl-c{color:var(--green);font-weight:700} .hl-f{color:color-mix(in srgb,var(--green) 60%,#ffffff)} .hl-p{color:color-mix(in srgb,var(--green) 45%,#4a5550)} .hl-a{color:color-mix(in srgb,var(--green) 80%,#ffffff)} .hl-o{color:color-mix(in srgb,var(--green) 25%,#e3ebe6)}
.grad{background:linear-gradient(90deg,var(--cyan),var(--violet) 50%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
a{color:var(--cyan);text-decoration:underline;text-decoration-color:rgba(124,199,232,.35);text-underline-offset:3px}
a:hover{color:var(--green);text-decoration-color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(3,5,4,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;height:62px}
.logo{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--fg);text-decoration:none;white-space:nowrap}
.logo b{color:var(--green)}
nav.menu{margin-left:auto;display:flex;gap:2px}
nav.menu a{font-family:var(--mono);font-size:13.5px;color:var(--soft);text-decoration:none;padding:6px 10px;border-radius:6px;transition:color .15s,background .15s}
nav.menu a:hover{color:var(--fg);background:color-mix(in srgb,var(--green) 7%,transparent)}
nav.menu a.on{color:var(--green)}
nav.menu a.on::before{content:"> "}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.lang button{font-family:var(--mono);font-size:12.5px;background:none;border:none;color:var(--dim);padding:5px 9px;cursor:pointer;transition:all .15s}
.lang button[aria-pressed="true"]{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.cvbtn{font-family:var(--mono);font-size:13.5px;font-weight:700;color:#06100a;background:var(--green);text-decoration:none;padding:7px 14px;border-radius:6px;white-space:nowrap}
.cvbtn:hover{background:#8fe0a6;color:#06100a}
.burger{display:none;font-family:var(--mono);font-size:13px;background:none;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}

/* Héros */
.hero{padding-block:56px 24px}
.term2{margin-top:18px;animation-delay:.25s,1.6s!important}
.term2 #log{padding-top:14px}
.term2 .prompt{border-top:none;background:var(--win)}
.term2 #log:not(:empty)+.prompt{border-top:1px solid var(--line)}
.win{background:linear-gradient(var(--win),var(--win)) padding-box,linear-gradient(120deg,rgba(111,211,232,.5),rgba(185,156,255,.35) 45%,rgba(255,140,198,.45)) border-box;border:1px solid transparent;border-radius:12px;overflow:hidden;animation:winIn .6s cubic-bezier(.2,.7,.2,1) both;position:relative}
@keyframes winIn{from{transform:translateY(16px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
.win{animation:winIn .6s cubic-bezier(.2,.7,.2,1) both,halo 9s ease-in-out 1s infinite}
@keyframes halo{0%,100%{box-shadow:0 0 34px -8px rgba(111,211,232,.28)}33%{box-shadow:0 0 40px -6px rgba(185,156,255,.30)}66%{box-shadow:0 0 36px -8px rgba(255,95,95,.26)}}
.titlebar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line);font-family:var(--mono)}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;display:block;background:#2a3830;transition:transform .2s}.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}.win:hover .dots i{transform:scale(1.15)}
.win:hover .dots i:nth-child(1){background:#ef6b6b}.win:hover .dots i:nth-child(2){background:#e6b450}.win:hover .dots i:nth-child(3){background:#6fd08c}
.titlebar .t{color:var(--dim);font-size:12.5px;flex:1;text-align:center}
.titlebar .clk{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.hbody{padding:30px 36px 24px}
.boot{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin:0 0 18px;display:grid;gap:2px}
.boot div{animation:lineIn .3s ease-out both}
.boot .ok{color:var(--green)}
@keyframes lineIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cmd{font-family:var(--mono);font-size:14px;color:var(--dim);margin:0 0 14px}
.cmd .ps{color:var(--green)}.cmd .ty{color:var(--fg)}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--green);vertical-align:-3px;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:var(--mono);font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0 0 10px;color:#f3f7f4;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.role{font-family:var(--mono);font-size:15.5px;color:var(--cyan);margin:0 0 18px;min-height:1.6em}
.lead{font-size:18px;color:var(--fg);max-width:62ch;margin:0 0 22px}
.stag>*{animation:lineIn .45s ease-out both}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;font-weight:700;text-decoration:none;border-radius:6px;padding:10px 16px;cursor:pointer;border:1px solid var(--green);transition:background .15s,color .15s,transform .15s}
.btn.p{background:var(--green);color:#06100a}.btn.p:hover{background:#8fe0a6;color:#06100a;transform:translateY(-1px)}
.btn.g{background:transparent;color:var(--green)}.btn.g:hover{background:color-mix(in srgb,var(--green) 10%,transparent);color:var(--green);transform:translateY(-1px)}
.btn .arr{transition:transform .2s}.btn:hover .arr{transform:translateX(3px)}
#log{padding:0 36px;max-height:180px;overflow-y:auto;font-family:var(--mono);font-size:13.5px}
#log:not(:empty){padding-bottom:10px}
#log div{padding:1px 0;white-space:pre-wrap;word-break:break-word;color:var(--soft);animation:lineIn .25s ease-out both}
#log .g{color:var(--green)}#log .a{color:var(--amber)}#log .r{color:var(--red)}#log .d{color:var(--dim)}
.prompt{display:flex;align-items:center;gap:10px;padding:13px 36px;border-top:1px solid var(--line);background:var(--bar);font-family:var(--mono);font-size:14px}
.prompt label{color:var(--green);white-space:nowrap}
.prompt input{flex:1;background:transparent;border:none;color:var(--fg);font:inherit;min-width:0;padding:3px 0;caret-color:var(--green)}
.prompt input:focus{outline:none}.prompt input::placeholder{color:var(--dim)}

/* Sections */
section.s{padding-block:64px 8px}
.shead{font-family:var(--mono);font-size:14px;color:var(--dim);margin:0 0 6px;min-height:1.7em}
.shead .ps{color:var(--green)}
.shead .c2{display:inline-block;width:.5em;height:1em;background:var(--green);vertical-align:-2px;margin-left:2px;opacity:0}
.shead.typing .c2{opacity:1;animation:blink .7s steps(1) infinite}
h2{font-family:var(--mono);font-size:clamp(24px,3.6vw,32px);font-weight:700;letter-spacing:-.02em;color:#f3f7f4;margin:0 0 28px;position:relative;display:inline-block}
h2::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:var(--green);transform:scaleX(0);transform-origin:left}
h2.hit::after{animation:uline .7s cubic-bezier(.2,.7,.2,1) .35s both}
h2{overflow:visible}
@keyframes uline{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(.18)}}
h2.flash{animation:flashTitle .9s ease-out}
@keyframes flashTitle{0%{color:var(--green);text-shadow:0 0 18px color-mix(in srgb,var(--green) 45%,transparent)}100%{color:#f3f7f4;text-shadow:none}}
h3{font-size:17px;margin:0 0 6px;color:#f3f7f4;font-weight:600}
.sub{display:block}
p{margin:0 0 14px;max-width:66ch;color:var(--soft)}
.dim{color:var(--dim)}
.reveal{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-play-state:paused}
.reveal.in{animation-play-state:running}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.chipbtn{font-family:var(--mono);font-size:13px;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;transition:all .15s}
.chipbtn:hover{color:var(--fg);border-color:#2c3c33}
.chipbtn[aria-pressed="true"],.chipbtn[aria-selected="true"]{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.tabp{animation:lineIn .3s ease-out both}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.box{background:var(--win);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.todo{border-style:dashed;color:var(--dim)}
.todo .tag{border-style:dashed}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;color:var(--soft)}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.list li{position:relative;padding-left:22px;color:var(--soft)}
ul.list li::before{content:"›";position:absolute;left:4px;color:var(--green);font-family:var(--mono);font-weight:700}

.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.skcat{padding:24px 26px}
.skcat:last-child:nth-child(odd){grid-column:1/-1}
.skh{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ski{width:46px;height:46px;flex:none;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 12%,transparent);border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.ski svg{width:24px;height:24px;fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skcat h3{font-family:var(--mono);font-size:19px;color:#f3f7f4;font-weight:700;margin:0;line-height:1.25}
.skn{font-family:var(--mono);font-size:12.5px;color:var(--green)}
.sklist{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.sklist li{display:grid;gap:6px;padding-left:16px;position:relative}
.sklist li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--green)}
.skname{font-size:17px;font-weight:600;color:var(--fg);line-height:1.35}
.skctx{display:flex;flex-wrap:wrap;gap:6px}
.skctx span{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:999px;color:color-mix(in srgb,var(--green) 70%,#fff);background:color-mix(in srgb,var(--green) 10%,transparent);border:1px solid color-mix(in srgb,var(--green) 25%,transparent)}

.timeline{display:grid}
.timeline article{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.timeline article:first-child{border-top:none;padding-top:0}
.yr{font-family:var(--mono);color:var(--amber);font-size:14px;padding-top:2px}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.pc{display:flex;flex-direction:column;gap:10px;background:var(--win);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;transition:border-color .25s,background-color .25s}
.pc:hover{border-color:color-mix(in srgb,var(--green) 40%,transparent);background-color:color-mix(in srgb,var(--green) 6%,var(--win))}
.pc[hidden]{display:none!important}
.pc .top{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px}
.pc .kind{color:var(--green)}.pc .date{color:var(--dim)}
.pc p{margin:0;font-size:15px}
.pc details{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.pc summary{font-family:var(--mono);font-size:13px;color:var(--cyan);cursor:pointer;list-style:none}
.pc summary::-webkit-details-marker{display:none}
.pc summary::before{content:"+ ";color:var(--green)}
.pc details[open] summary::before{content:"− "}
.pc .files{display:grid;gap:2px;margin-top:8px}
.pc .files a{font-size:14.5px;display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--fg);padding:3px 0;animation:lineIn .25s ease-out both}
.pc .files a:hover{color:var(--green)}
.ft{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-transform:uppercase}
.pc .more{margin-top:auto;font-family:var(--mono);font-size:13px}

.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.st{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--win);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;overflow:hidden;
  transition:border-color .25s,background-color .25s}
.st[hidden]{display:none!important}
.st:hover{border-color:color-mix(in srgb,var(--green) 40%,transparent);background-color:color-mix(in srgb,var(--green) 6%,var(--win))}
.stack.boot .st,.st.pop{animation:stIn .45s cubic-bezier(.2,.7,.2,1) calc(var(--k)*55ms) both}
@keyframes stIn{from{transform:translateY(12px) scale(.97)}to{transform:none}}
.lg{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bar);display:grid;place-items:center;margin-bottom:8px;transition:border-color .2s}
.st:hover .lg{border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.lg svg{width:26px;height:26px;fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack.boot .lg svg path,.stack.boot .lg svg rect,.st.pop .lg svg path,.st.pop .lg svg rect{stroke-dasharray:120;animation:draw2 1s ease-out calc(var(--k)*55ms + .15s) both}
@keyframes draw2{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
.lg img{max-width:32px;max-height:32px;object-fit:contain}
.nm{font-family:var(--mono);font-size:14px;font-weight:700;color:#f3f7f4;line-height:1.35}
.ds{font-size:13.5px;color:var(--dim);line-height:1.45}
.ft2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px;font-family:var(--mono);font-size:11px}
.ft2 .cat{color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ft2 .on{color:var(--green);display:inline-flex;align-items:center;gap:5px}
.ft2 .on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:pls 2.2s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 50%,transparent)}70%,100%{box-shadow:0 0 0 6px color-mix(in srgb,var(--green) 0%,transparent)}}
.csplit{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
form.cf{display:grid;gap:14px}
label.f{display:block;font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-bottom:5px}
input.f,textarea.f{width:100%;font:inherit;color:var(--fg);background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:10px 12px;transition:border-color .2s}
input.f:focus,textarea.f:focus{outline:none;border-color:var(--green)}
textarea.f{min-height:140px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.msg{font-size:14px;min-height:1.2em}.msg.err{color:var(--red)}.msg.info{color:var(--amber)}
.rgpd{font-size:13.5px;color:var(--dim)}

footer{margin-top:24px;border-top:1px solid var(--line);padding-block:26px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:900px){

  .csplit{grid-template-columns:1fr}

/* ===== Système de cartes unifié ===== */
.box,.pc,.st,.skcat,.timeline article{background:var(--win);border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--green) 55%,transparent);
  border-radius:10px;padding:22px;min-width:0;transition:border-color .25s,background-color .25s}
.box:hover,.pc:hover,.st:hover,.skcat:hover,.timeline article:hover{border-color:color-mix(in srgb,var(--green) 40%,transparent);border-top-color:var(--green);background-color:color-mix(in srgb,var(--green) 6%,var(--win))}
.todo,.todo:hover{border-style:dashed;border-top-style:dashed}
/* titres de cartes */
.box h3,.pc h3,.skcat h3,.timeline h3,.nm{font-family:var(--mono);font-size:17px;font-weight:700;color:#f3f7f4;line-height:1.35;margin:0 0 6px}
.skcat h3{margin:0}
.st .nm::before,.pc .kind::before{display:none}
/* méta (catégorie, date, compteur) */
.skn,.pc .kind,.ft2 .cat,.yr{font-family:var(--mono);font-size:12.5px;color:var(--green);text-transform:none;letter-spacing:0;font-weight:500}
.pc .date{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
/* texte courant des cartes */
.box p,.pc p,.ds,.timeline p{font-size:15px;color:var(--soft);line-height:1.6}
/* pictos */
.lg,.ski{width:46px;height:46px;flex:none;border-radius:10px;display:grid;place-items:center;margin:0 0 12px;background:color-mix(in srgb,var(--green) 12%,transparent);border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.ski{margin:0}
.lg svg,.ski svg{width:24px;height:24px}
/* étiquettes */
.tag,.skctx span{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:999px;color:color-mix(in srgb,var(--green) 70%,#fff);background:color-mix(in srgb,var(--green) 10%,transparent);border:1px solid color-mix(in srgb,var(--green) 25%,transparent)}
.todo .tag{border-style:dashed}
/* diplômes en cartes */
.timeline{gap:14px}
.timeline article,.timeline article:first-child{grid-template-columns:110px minmax(0,1fr);gap:18px;padding:22px}
.timeline p:last-child{margin-bottom:0}
.yr{font-size:15px;font-weight:700;padding-top:1px}
/* grilles : même espacement partout */
.grid2,.grid3,.skgrid,.stack,.pcards{gap:16px}
/* interlignage resserré dans les cartes */
.box,.pc,.st,.skcat,.timeline article{line-height:1.45}
.box p,.pc p,.ds,.timeline p{line-height:1.45;margin-bottom:8px}
.box h3,.pc h3,.skcat h3,.timeline h3,.nm{line-height:1.25;margin-bottom:4px}
.pc{gap:8px}.st{gap:3px}
.sklist{gap:9px}.sklist li{gap:4px}.skname{line-height:1.3}
.skh{margin-bottom:14px;padding-bottom:12px}
.box ul.list{gap:4px}.box ul.list li{line-height:1.45}
.pc .files a{padding:2px 0}
@media (max-width:620px){.box,.pc,.st,.skcat,.timeline article,.timeline article:first-child{padding:18px}.timeline article,.timeline article:first-child{grid-template-columns:1fr;gap:4px}}

/* ===== Diplômes en arborescence ===== */
.dtree{font-family:var(--mono);font-size:14.5px}
.droot{color:var(--green);font-weight:700;margin-bottom:4px;display:flex;align-items:baseline;gap:8px}
.dnode>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:4px 0;min-width:0}
.dnode>summary::-webkit-details-marker{display:none}
.br{color:var(--dim);white-space:pre;flex:none}
.chev{color:var(--green);display:inline-block;transition:transform .2s;flex:none}
.dnode[open]>summary .chev,.chev.on{transform:rotate(90deg)}
.dir{color:var(--green);font-weight:700;flex:none}
.dmeta{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dnode>summary:hover .dir{text-decoration:underline;text-underline-offset:3px}
.dkid{padding-bottom:6px}
.dkid:not(.last){background:linear-gradient(var(--dim),var(--dim)) calc(.5ch - .5px) 0/1px 100% no-repeat;opacity:1}
.fline{white-space:pre;color:var(--dim);padding:2px 0}
.file{color:color-mix(in srgb,var(--green) 70%,#fff)}
.dcard{margin:4px 0 8px 8ch;font-family:var(--sans)}
.dnode[open] .dcard{animation:lineIn .3s ease-out both}
@media (max-width:620px){.dcard{margin-left:4ch}.dnode>summary .dmeta{display:none}}

function secTerm(sec,c){
 const log=c.querySelector('.clog'),inp=c.querySelector('input'),id=sec.id,hist=[];let hi=0;
 const out=(h,cls)=>{const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight};
 c.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const raw=inp.value;if(!raw.trim())return;hist.push(raw);hi=hist.length;inp.value='';
  out(`<span class="g">$</span> ${esc(raw)}`);
  const [cm,...rest]=raw.trim().split(/\s+/);const c2=cm.toLowerCase(),a=rest.join(' ').toLowerCase();
  if(ST[id]&&ST[id].run(c2,a,sec,out))return;
  if(c2==='help'){out((L==='fr'?'<span class="a">Commandes de cette section</span>\n':'<span class="a">Section commands</span>\n')+esc(ST[id].help[L])+(L==='fr'?'\n\n<span class="a">Générales</span>\ncd &lt;section&gt; · cv · linkedin · lang en · clear':'\n\n<span class="a">General</span>\ncd &lt;section&gt; · cv · linkedin · lang fr · clear'));return}
  if(c2==='clear'){log.innerHTML='';return}
  run(raw,out);
 });
 inp.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&hi>0){inp.value=hist[--hi];e.preventDefault()}if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}});
}

function type(el,txt,speed,delaySec){if(!el)return;if(reduce){el.textContent=txt;return}el.textContent='';setTimeout(()=>{let i=0;const iv=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(iv)},speed)},delaySec*1000)}
const GL='!<>-_\\/[]{}=+*^?#01ABCDEF';
function decode(el,txt,dur){if(!el)return;const my=el._dec=(el._dec||0)+1;if(reduce){el.textContent=txt;return}const t0=performance.now();
 (function f(now){if(el._dec!==my)return;const k=Math.min(1,(now-t0)/dur);const n=Math.floor(txt.length*k);
  el.textContent=txt.slice(0,n)+txt.slice(n).replace(/\S/g,()=>GL[Math.floor(Math.random()*GL.length)]);
  if(k<1)requestAnimationFrame(f);else el.textContent=txt})(t0)}
function animateHead(sec){
 if(!sec)return;const sh=sec.querySelector('.shead'),ct=sh.querySelector('.ct'),h=sec.querySelector('h2');
 if(reduce)return;
 sh.classList.add('typing');const txt=sh.dataset.cmd;ct.textContent='';let i=0;clearInterval(sh._iv);
 sh._iv=setInterval(()=>{ct.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(sh._iv);ct.innerHTML=hl(txt);setTimeout(()=>sh.classList.remove('typing'),500)}},Math.max(14,320/txt.length));
 h.style.setProperty('--tw',h.offsetWidth+'px');h.classList.remove('hit','flash');void h.offsetWidth;h.classList.add('hit','flash');
 decode(h,h.dataset.title,450);
}

/* Assemblage */
const menu=document.getElementById('menu'),burger=document.getElementById('burger');
let io,spyLinks=[],spySecs=[];
function build(animateHero){
 const t=T[L];
 document.documentElement.lang=L;
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
 menu.innerHTML=t.nav.map(n=>`<a href="#${n[0]}" data-sec="${n[0]}">${n[1]}</a>`).join('');
 menu.setAttribute('aria-label',L==='fr'?'Sections':'Sections');
 document.getElementById('cvtop').href=CV;
 hero(animateHero);
 document.getElementById('sections').innerHTML=sections();
 document.querySelectorAll('#sections section.s').forEach(sec=>{
  const id=sec.id,w=document.createElement('div');w.className='swin';
  w.innerHTML=`<div class="titlebar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="t">alexandre@portfolio: ~/${FN[id]}</div><div class="clk">${id}</div></div>`;
  const b=document.createElement('div');b.className='sbody';while(sec.firstChild)b.appendChild(sec.firstChild);w.appendChild(b);sec.appendChild(w);
  const c=document.createElement('div');c.className='cwin';
  c.innerHTML=`<div class="titlebar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="t">bash — ~/${id}</div><div class="clk">${L==='fr'?'commandes':'commands'}</div></div>
   <div class="clog" aria-live="polite"></div><form autocomplete="off"><label for="ct-${id}">~/${id}$</label><input id="ct-${id}" spellcheck="false" placeholder="${(ST[id]||{}).ph?ST[id].ph[L]:'help'}" aria-label="${L==='fr'?'Commande':'Command'} ${id}"></form>`;
  sec.appendChild(c);secTerm(sec,c);
 });
 bind();
}
function bind(){
 spyLinks=[...menu.querySelectorAll('a')];spySecs=spyLinks.map(a=>document.getElementById(a.dataset.sec));spy();
 spyLinks.forEach(a=>a.addEventListener('click',()=>{menu.classList.remove('open');burger.setAttribute('aria-expanded','false');setTimeout(()=>animateHead(document.getElementById(a.dataset.sec)),reduce?0:350)}));
 document.querySelectorAll('[data-ab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-ab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('[data-abp]').forEach(p=>p.hidden=p.dataset.abp!==b.dataset.ab);
 }));
 document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>applyFilter(b.dataset.f)));
 document.querySelectorAll('[data-sf]').forEach(b=>b.addEventListener('click',()=>{stackF=b.dataset.sf;
  document.querySelectorAll('[data-sf]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  let n=0;document.querySelectorAll('.st').forEach(el=>{const sh=stackF==='all'||el.dataset.c===stackF;el.hidden=!sh;if(sh){el.style.setProperty('--k',n++);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}});
 }));
 const stk=document.querySelector('.stack');if(stk&&'IntersectionObserver' in window){const o2=new IntersectionObserver(es=>{if(es[0].isIntersecting){stk.classList.add('boot');o2.disconnect()}},{rootMargin:'0px 0px -15% 0px'});o2.observe(stk)}else if(stk)stk.classList.add('boot');
 document.querySelectorAll('section.s').forEach(s=>s.classList.add('reveal'));
 if(io)io.disconnect();
 if('IntersectionObserver' in window){
  io=new IntersectionObserver(es=>es.forEach(e=>{
   if(e.isIntersecting){e.target.classList.add('in');if(!e.target._seen){e.target._seen=true;animateHead(e.target)}}
   else if(e.boundingClientRect.top>0)e.target._seen=false;
  }),{rootMargin:'0px 0px -25% 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
 }else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
 bindForm();
}
function applyFilter(k){
 filt=k;document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===k));
 const sec=document.getElementById('portfolio'),sh=sec.querySelector('.shead');sh.dataset.cmd=T[L].port.cmd+filtName();
 animateHead(sec);if(reduce)sh.querySelector('.ct').innerHTML=hl(sh.dataset.cmd);
 let n=0;document.querySelectorAll('.pc').forEach(c=>{const show=k==='tous'||c.dataset.c===k;c.hidden=!show;if(show&&!reduce){c.style.animation='none';void c.offsetWidth;c.style.animation=`rise .4s cubic-bezier(.2,.7,.2,1) ${(n++%6)*0.05}s both`}});
}
function spy(){let cur=null;spySecs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<160)cur=i});spyLinks.forEach((a,i)=>a.classList.toggle('on',i===cur))}
addEventListener('scroll',spy,{passive:true});
burger.addEventListener('click',()=>{const o=menu.classList.toggle('open');burger.setAttribute('aria-expanded',o)});
function setLang(l){if(l===L)return;L=l;try{localStorage.setItem('ad-lang',l)}catch(e){}const y=scrollY;build(false);scrollTo(0,y);updatePrompt();log.innerHTML='';say(T[L].term.welcome)}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* Formulaire */
function bindForm(){
 const fm=document.getElementById('cform'),out=document.getElementById('cout'),c=T[L].contact;
 fm.addEventListener('input',()=>{out.textContent='';out.className='msg'});
 fm.addEventListener('submit',e=>{e.preventDefault();
  const m=fm.email.value.trim(),o=fm.objet.value.trim(),ms=fm.message.value.trim(),k=fm.captcha.value.trim();
  if(!m||!o||!ms){out.className='msg err';out.textContent=c.e1;return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){out.className='msg err';out.textContent=c.e2;return}
  if(k!=='4'){out.className='msg err';out.textContent=c.e3;return}
  out.className='msg info';out.textContent=c.ok;
 });
}

/* Terminal interactif */
const log=document.getElementById('log'),cl=document.getElementById('cmdline');const hist=[];let hi=0;
const SEC={'a-propos':'a-propos',apropos:'a-propos',about:'a-propos',competences:'competences',skills:'competences',stack:'stack',environnement:'stack',outils:'stack',diplomes:'diplomes',education:'diplomes',portfolio:'portfolio',projets:'portfolio',projects:'portfolio',contact:'contact','~':'accueil',accueil:'accueil',home:'accueil'};
let say=function(h,cls){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight}
function go(id){const el=document.getElementById(id);el.scrollIntoView({behavior:reduce?'auto':'smooth'});if(id!=='accueil')setTimeout(()=>animateHead(el),reduce?0:450)}
function run(raw,outFn){const say0=say;if(outFn)say=(h,c)=>outFn(h,c);try{runCore(raw,!outFn)}finally{say=say0}}
function runCore(raw,echo){
 const tt=T[L].term;const [c,...a]=raw.trim().split(/\s+/);const arg=a.join(' ').replace(/\/$/,'').replace(/^~\//,'').toLowerCase();
 if(echo)say(`<span class="g">$</span> ${esc(raw)}`);
 switch((c||'').toLowerCase()){
  case 'help':say(tt.help);break;
  case 'ls':say(L==='fr'?'a-propos  competences  stack  diplomes  portfolio  contact':'about  skills  stack  education  portfolio  contact');break;
  case 'cd':case 'cat':case 'open':{const k=SEC[arg];if(k){say(`→ ${k}`,'d');go(k)}else say(tt.cdErr(esc(arg)||'?'),'r');break}
  case 'whoami':say(tt.who);break;
  case 'cv':say(`→ ${ext(CV,'denis-alexandre-cv_2025.pdf')}`);break;
  case 'linkedin':say(`→ ${ext(LINKEDIN,'linkedin.com/in/alexandre-denis')}`);break;
  case 'lang':if(arg==='en'||arg==='fr')setLang(arg);else say('lang fr | lang en','a');break;
  case 'clear':log.innerHTML='';break;
  case 'sudo':say(tt.sudo,'r');break;
  default:say(tt.nf(esc(c)));
 }
}
document.getElementById('term').addEventListener('submit',e=>{e.preventDefault();const v=cl.value;if(!v.trim())return;hist.push(v);hi=hist.length;run(v);cl.value=''});
cl.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'&&hi>0){cl.value=hist[--hi];e.preventDefault()}
 if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);cl.value=hist[hi]||''}
 if(e.key==='Tab'){e.preventDefault();const p=cl.value.split(' ');const last=p.pop();const m=last&&Object.keys(SEC).concat(['help','ls','cd','whoami','cv','linkedin','lang','clear']).find(k=>k.startsWith(last));if(m){p.push(m);cl.value=p.join(' ')}}
});
/* Suggestions qui s'écrivent dans l'invite */
let phI=0,phTimer;
function updatePrompt(){clearTimeout(phTimer);const list=T[L].ph;if(reduce){cl.placeholder=list[0];return}
 const word=list[phI%list.length];let i=0,dir=1;
 (function step(){if(document.activeElement===cl&&cl.value){phTimer=setTimeout(step,800);return}
  cl.placeholder=word.slice(0,i);
  if(dir===1){if(i<word.length){i++;phTimer=setTimeout(step,90)}else{dir=-1;phTimer=setTimeout(step,1600)}}
  else{if(i>0){i--;phTimer=setTimeout(step,40)}else{phI++;phTimer=setTimeout(updatePrompt,300)}}})();
}

/* Horloge */
const clk=document.getElementById('clk');function tick(){clk.textContent=new Date().toLocaleTimeString(L==='fr'?'fr-FR':'en-GB')}tick();setInterval(tick,1000);

build(true);
say(T[L].term.welcome,'d');
setTimeout(updatePrompt,reduce?0:2200);
</script>
